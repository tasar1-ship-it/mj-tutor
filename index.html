function checkErrors(text) {
  const errors = [];
  for (const rule of CORRECTIONS) {
    const match = text.match(rule.pattern);
    if (match) errors.push({ original: match[0], fixed: rule.fix ? rule.fix(match) : null, tip: rule.tip });
  }
  return errors;
}

/* ── GIBBERISH DETECTION & SENTENCE VALIDATION ── */

// Instead of a dictionary whitelist, detect words that CAN'T be English
function isGibberish(word) {
  const w = word.toLowerCase().replace(/[^a-z]/g, "");
  if (w.length <= 2) return false; // too short to judge (ok, TV, am, etc.)
  
  // Must contain at least one vowel (y counts)
  if (!/[aeiouy]/.test(w)) return true;
  
  // No English word has 4+ consonants in a row
  if (/[bcdfghjklmnpqrstvwxz]{4,}/.test(w)) return true;
  
  // No English word has 3+ of the same letter in a row
  if (/(.)\1{2,}/.test(w)) return true;
  
  // Vowel-to-total ratio too extreme
  const vowels = (w.match(/[aeiouy]/g) || []).length;
  const ratio = vowels / w.length;
  if (w.length > 3 && ratio < 0.15) return true; // almost no vowels
  if (w.length > 3 && ratio > 0.85) return true; // almost all vowels
  
  // Unlikely patterns: q not followed by u, double-j, double-k, etc.
  if (/q[^u]/.test(w) && w !== "qi") return true;
  if (/jj|kk|vv|xx|zz|ww|yy/.test(w)) return true;
  
  return false;
}

function validateSentence(text) {
  const issues = [];
  const clean = text.trim();
  const words = clean.split(/\s+/);
  const alphaWords = words.filter(w => /[a-zA-Z]{2,}/.test(w));

  // Too short
  if (alphaWords.length === 1 && clean.length < 4) {
    issues.push({ type: "short", tip: "One word isn't enough practice! Try writing a full sentence." });
  }

  // Check for gibberish words
  const gibberishWords = alphaWords.filter(w => isGibberish(w.replace(/[^a-zA-Z]/g, "")));
  
  if (gibberishWords.length > 0 && gibberishWords.length >= alphaWords.length * 0.5) {
    // Most words are gibberish
    issues.push({ type: "gibberish", tip: "I can't understand this. Did you mean to write something else? Please try again!" });
  } else if (gibberishWords.length > 0) {
    const flagged = gibberishWords.slice(0, 3).map(w => `"${w}"`).join(", ");
    issues.push({ type: "spelling", words: gibberishWords, tip: `This doesn't look right: ${flagged}. Check the spelling!` });
  }

  // No capital letter at start (if it looks like a sentence)
  if (alphaWords.length >= 3 && clean[0] === clean[0].toLowerCase() && /[a-z]/.test(clean[0])) {
    issues.push({ type: "capital", tip: "Start your sentence with a capital letter." });
  }

  // No period/question mark at end (if it looks like a sentence)
  if (alphaWords.length >= 4 && !/[.!?]$/.test(clean)) {
    issues.push({ type: "punctuation", tip: "End your sentence with a period (.) or question mark (?)." });
  }

  return issues;
}

/* ── TEXT RENDERER ── */

const hasKorean = (s) => /[\uAC00-\uD7AF\u1100-\u11FF\u3130-\u318F]/.test(s);

function renderLine(line, j) {
  return line.split(/(\*\*[^*]+\*\*)/).map((p, k) =>
    p.startsWith("**") && p.endsWith("**")
      ? <strong key={`${j}-${k}`} style={{ color: C.correctBold, fontWeight: 600 }}>{p.slice(2, -2)}</strong>
      : p
  );
}

function CoachBubble({ text }) {
  const [showKR, setShowKR] = useState(false);
  if (!text) return null;

  const lines = text.split("\n");
  let hasKR = false;

  // Check if any Korean exists in the text at all
  const koreanRegex = /[\uAC00-\uD7AF]/;
  if (koreanRegex.test(text)) hasKR = true;

  // Process a line: strip inline Korean parentheticals when flag is off
  const processLine = (line) => {
    if (showKR) return line;
    // Remove inline Korean in parentheses: (마감일), (재료), etc.
    let processed = line.replace(/\s*\([^)]*[\uAC00-\uD7AF][^)]*\)\s*/g, " ");
    // Remove 🇰🇷 markers
    processed = processed.replace(/🇰🇷/g, "").trim();
    return processed;
  };

  // Determine if an entire line is Korean-only (should be hidden entirely when flag off)
  const isFullKoreanLine = (line) => {
    const koreanChars = (line.match(/[\uAC00-\uD7AF]/g) || []).length;
    const totalAlpha = (line.match(/[a-zA-Z\uAC00-\uD7AF]/g) || []).length;
    // Line is mostly Korean, or is a Korean parenthetical line, or is a 🇰🇷 line
    if (koreanChars > 3 && totalAlpha > 0 && koreanChars / totalAlpha > 0.6) return true;
    if (koreanChars > 0 && line.trim().startsWith("(") && line.trim().endsWith(")")) return true;
    if (line.includes("🇰🇷") && koreanChars > 0) return true;
    return false;
  };

  // If no Korean found, render normally without flag
  if (!hasKR) {
    return <span>{lines.map((line, i) => (
      <span key={i}>{i > 0 && <br />}{renderLine(line, i)}</span>
    ))}</span>;
  }

  // Build output
  const outputLines = [];
  lines.forEach((line, i) => {
    if (isFullKoreanLine(line)) {
      // Full Korean line — only show when flag is on
      if (showKR) {
        outputLines.push({ line, isKR: true, idx: i });
      }
    } else {
      // English line (may contain inline Korean to strip)
      outputLines.push({ line: processLine(line), isKR: false, idx: i });
    }
  });

  return (
    <span>
      {outputLines.map((item, i) => (
        <span key={i} style={item.isKR ? { opacity: 0.7, fontStyle: "italic" } : undefined}>
          {i > 0 && <br />}
          {item.line.trim() === "" ? null : renderLine(item.line, i)}
        </span>
      ))}
      {/* Korean toggle button */}
      <br />
      <span
        onClick={(e) => { e.stopPropagation(); setShowKR(!showKR); }}
        style={{
          display: "inline-flex",
          alignItems: "center",
          justifyContent: "center",
          marginTop: 8,
          padding: "6px 12px",
          fontSize: 22,
          borderRadius: 10,
          cursor: "pointer",
          background: showKR ? C.accentDeep : "rgba(0,0,0,0.06)",
          transition: "all 0.15s",
          userSelect: "none",
          lineHeight: 1,
        }}
      >
        🇰🇷
      </span>
    </span>
  );
}

        b += `\n💡  ${e.tip}`;
        return b;
      }).join("\n\n");
    }

    if (validation.length > 0) {
      hasIssues = true;
      const vParts = validation.map(v => {
        if (v.type === "gibberish") return `⚠️  ${v.tip}`;

        return `💡  ${v.tip}`;

      if (response) response += "\n\n";
      response += vParts.join("\n\n");

      {/* Font imports + silver shine */}
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=DM+Sans:wght@300;400;500;600;700&display=swap');
        .silver-text {
          background: linear-gradient(
            105deg,
            #727E86 0%,
            #9EAAB3 20%,
            #C5CDD3 35%,
            #ACB6BE 45%,
            #7E8C95 55%,
            #9DAAB2 70%,
            #BCC5CB 80%,
            #8B98A1 100%
          );
          -webkit-background-clip: text;
          -webkit-text-fill-color: transparent;
          background-clip: text;
          background-size: 200% 100%;
          animation: silverShimmer 6s ease-in-out infinite;
        }
        @keyframes silverShimmer {
          0%, 100% { background-position: 0% 50%; }
          50% { background-position: 100% 50%; }
        }
        .silver-sub {
          background: linear-gradient(
            105deg,
            #636E76 0%,
            #808E97 40%,
            #9EAAB3 60%,
            #758088 100%
          );
          -webkit-background-clip: text;
          -webkit-text-fill-color: transparent;
          background-clip: text;
        }
        .chat-input::placeholder {
          color: #8DA3A3;
          opacity: 1;
        }
      `}</style>

      {/* ── HEADER ── */}
      <div style={{
        padding: "18px 20px",
        background: C.headerBg,
        borderBottom: `1px solid ${C.silverLight}`,
        display: "flex", alignItems: "center",
        flexShrink: 0,
        position: "relative", zIndex: 1,
      }}>
        {/* Back arrow — fixed left */}
        <div style={{ width: 36, flexShrink: 0 }}>
          {view !== "home" && (
            <div onClick={goHome} style={{
              cursor: "pointer", fontSize: 18, color: "#D0D8DD",
              width: 32, height: 32, display: "flex", alignItems: "center", justifyContent: "center",
              borderRadius: 8,
            }}>←</div>
          )}
        </div>

        {/* Centered title */}
        <div style={{ flex: 1, textAlign: "center" }}>
          {view === "home" ? (
            <div className="silver-text" style={{ fontSize: 24, fontWeight: 500, letterSpacing: "0.2px", fontFamily: F.serif }}>
              <span>Private English Tutor for <i>Mi Jung</i></span>
            </div>
          ) : (
            <div style={{ fontSize: 24, fontWeight: 500, letterSpacing: "0.2px", fontFamily: F.serif, color: "#D5DDE2" }}>
              {view === "topics" ? "Free Talk" : view === "grammar" ? "Grammar Gym" : view === "vocab" ? "Word Builder" : topic?.title || ""}
            </div>
          )}
          {view !== "home" && <div style={{ fontSize: 9.5, marginTop: 3, fontWeight: 500, letterSpacing: "1.2px", textTransform: "uppercase", fontFamily: F.sans, color: "#ADBCC3" }}>
            {view === "topics" ? "Choose a conversation" : view === "grammar" ? "Choose a topic" : view === "vocab" ? "Choose a theme" : topic?.mode === "FREE_TALK" ? "Free conversation" : topic?.mode === "GRAMMAR" ? "Grammar practice" : "Vocabulary practice"}
          </div>}
        </div>

        {/* Spacer for centered title balance */}
        <div style={{ width: 36, flexShrink: 0 }} />
      </div>

      {/* ── BODY ── */}
      <div style={{ flex: 1, overflowY: "auto", padding: "24px 28px", position: "relative", zIndex: 1 }}>

        {/* HOME */}
        {view === "home" && <>
          {/* Hero card — styled like the Tiffany box */}
          <div style={{
            background: `linear-gradient(135deg, #3A9E98 0%, ${C.accentDeep} 40%, ${C.accent} 70%, ${C.accentSoft} 100%)`,
            borderRadius: 24, padding: "36px 32px",
            color: C.white, marginBottom: 32,
            boxShadow: `0 8px 32px rgba(0,0,0,0.3), 0 2px 8px ${C.accent}30`,
          }}>
            <div style={{ fontSize: 32, fontWeight: 500, marginBottom: 8, letterSpacing: "-0.3px", fontFamily: F.serif }}>Welcome back, MJ</div>
            <div style={{ fontSize: 15, opacity: 0.7, lineHeight: 1.6, fontWeight: 400, fontFamily: F.sans }}>다시 오셨네요! 오늘도 영어 연습해요.</div>
            <div style={{ fontSize: 20, lineHeight: 1.6, fontWeight: 400, marginTop: 10, color: C.white, fontFamily: F.serif, fontStyle: "italic" }}>Let's get to work.</div>
          </div>

          {/* Mode cards */}
          {[
            { label: "Free Talk", sub: "Chat naturally & get corrections", tag: "자유", fn: () => setView("topics") },
            { label: "Grammar Gym", sub: "Structured lessons & exercises", tag: "문법", fn: () => setView("grammar") },
            { label: "Word Builder", sub: "Themed vocabulary & quizzes", tag: "단어", fn: () => setView("vocab") },
          ].map((m, i) => (
            <div key={i} onClick={m.fn} style={{
              background: C.cardBg,
              border: "none",
              borderRadius: 18, padding: "24px",
              marginBottom: 14, cursor: "pointer",
              display: "flex", alignItems: "center", gap: 20,
              boxShadow: "0 4px 20px rgba(0,0,0,0.15)",
              transition: "box-shadow 0.15s, transform 0.15s",
            }}>
              <div style={{
                width: 52, height: 52, borderRadius: 14,
                background: `linear-gradient(135deg, ${C.accent}, ${C.accentDeep})`,
                display: "flex", alignItems: "center", justifyContent: "center",
                fontSize: 14, fontWeight: 700, color: C.white, fontFamily: F.sans,
                letterSpacing: "0.5px", flexShrink: 0,
                boxShadow: `0 2px 10px ${C.accent}40`,
              }}>{m.tag}</div>
              <div style={{ flex: 1 }}>
                <div style={{ fontWeight: 500, fontSize: 18, color: C.dark, marginBottom: 4, fontFamily: F.serif }}>{m.label}</div>
                <div style={{ fontSize: 14, color: C.darkMuted, lineHeight: 1.4, fontFamily: F.sans }}>{m.sub}</div>
              </div>
              <div style={{ color: C.silver, fontSize: 16, fontWeight: 300 }}>›</div>
            </div>
          ))}

          {/* Progress Report */}
          <div onClick={() => {}} style={{
            background: C.cardBg,
            border: "none",
            borderRadius: 18, padding: "14px 24px",
            marginBottom: 14, cursor: "pointer",
            display: "flex", alignItems: "center", gap: 20,
            boxShadow: "0 4px 20px rgba(0,0,0,0.15)",
            opacity: 0.85,
          }}>
            <div style={{
              width: 46, height: 34, borderRadius: 10,
              background: `linear-gradient(135deg, ${C.silver}, ${C.darkMuted})`,
              display: "flex", alignItems: "center", justifyContent: "center",
              fontSize: 14, flexShrink: 0,
              boxShadow: "0 2px 8px rgba(0,0,0,0.12)",
            }}>📊</div>
            <div style={{ flex: 1 }}>
              <div style={{ fontWeight: 500, fontSize: 14, color: C.dark, fontFamily: F.serif }}>Progress Report</div>
            </div>
            <div style={{ color: C.silver, fontSize: 16, fontWeight: 300 }}>›</div>
          </div>

          {/* Tip */}
          <div style={{
            marginTop: 20, padding: "16px 18px",
            background: "rgba(255,255,255,0.12)",
            border: `1px solid rgba(255,255,255,0.18)`,
            borderRadius: 14,
            fontSize: 12.5, color: C.textOnDark, lineHeight: 1.65, fontWeight: 400,
            fontFamily: F.sans,
            backdropFilter: "blur(4px)",
            boxShadow: "0 2px 12px rgba(0,0,0,0.08)",
          }}>
            <span style={{ color: "#9EAAB3", fontWeight: 600, fontFamily: F.serif, fontSize: 13.5 }}>Tip</span>
            <span style={{ color: C.textMutedOnDark }}> — </span>
            Everything works instantly, no waiting. Your tutor checks grammar automatically as you type.
          </div>
        </>}

        {/* FREE TALK PICKER */}
        {view === "topics" && CONVERSATIONS.map((c, i) => (
          <div key={i} onClick={() => startTalk(c)} style={{
            background: C.cardBg, border: "none",
            borderRadius: 16, padding: "18px 22px",
            display: "flex", alignItems: "center", gap: 16,
            marginBottom: 12, cursor: "pointer",
            boxShadow: "0 4px 20px rgba(0,0,0,0.15)",
          }}>
            <div style={{
              width: 44, height: 44, borderRadius: 12,
              background: `linear-gradient(135deg, ${C.accent}20, ${C.accentDeep}20)`,
              display: "flex", alignItems: "center", justifyContent: "center",
              fontSize: 18, flexShrink: 0,
            }}>{TALK_ICONS[i]}</div>
            <div style={{ flex: 1 }}>
              <div style={{ fontWeight: 500, fontSize: 16, color: C.dark, fontFamily: F.serif }}>{c.topic}</div>
              <div style={{ fontSize: 13, color: C.darkMuted, marginTop: 3, lineHeight: 1.3 }}>{c.starter.split("\n")[0].slice(0, 55)}...</div>
            </div>
            <div style={{ color: C.silver, fontSize: 14 }}>›</div>
          </div>
        ))}

        {/* GRAMMAR PICKER */}
        {view === "grammar" && GTOPICS.map((t, i) => (
          <div key={t.key} onClick={() => startGrammar(t.key)} style={{
            background: C.cardBg, border: "none",
            borderRadius: 16, padding: "18px 22px",
            display: "flex", alignItems: "center", gap: 16,
            marginBottom: 12, cursor: "pointer",
            boxShadow: "0 4px 20px rgba(0,0,0,0.15)",
          }}>
            <div style={{
              width: 32, height: 32, borderRadius: 9,
              background: `linear-gradient(135deg, ${C.accent}, ${C.accentDeep})`,
              border: "none",
              display: "flex", alignItems: "center", justifyContent: "center",
              fontSize: 12, fontWeight: 700, color: C.white, flexShrink: 0,
            }}>{i + 1}</div>
            <div style={{ flex: 1, fontWeight: 500, fontSize: 16, color: C.dark, fontFamily: F.serif }}>{t.title}</div>
            <div style={{ color: C.silver, fontSize: 14 }}>›</div>
          </div>
        ))}

        {/* VOCAB PICKER */}
        {view === "vocab" && (
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10 }}>
            {VTOPICS.map(t => (
              <div key={t.key} onClick={() => startVocab(t.key)} style={{
                background: C.cardBg, border: "none",
                borderRadius: 16, padding: "24px 16px",
                textAlign: "center", cursor: "pointer",
                boxShadow: "0 4px 20px rgba(0,0,0,0.15)",
              }}>
                <div style={{ fontSize: 32, marginBottom: 8 }}>{t.icon}</div>
                <div style={{ fontWeight: 500, fontSize: 14, color: C.dark, letterSpacing: "0.2px", fontFamily: F.serif }}>{t.title}</div>
              </div>
            ))}
          </div>
        )}

        {/* CHAT */}
        {view === "chat" && <>
          {chat.map((m, i) => (
            <div key={i} style={{
              display: "flex",
              justifyContent: m.role === "user" ? "flex-end" : "flex-start",
              marginBottom: 14,
              paddingLeft: m.role === "user" ? 48 : 0,
              paddingRight: m.role === "user" ? 0 : 48,
            }}>
              <div style={{
                background: m.role === "user"
                  ? `linear-gradient(135deg, ${C.accent}, ${C.accentDeep})`
                  : C.cardBg,
                color: m.role === "user" ? C.white : C.dark,
                padding: "14px 20px",
                fontSize: 16,
                lineHeight: 1.7,
                whiteSpace: "pre-wrap",
                borderRadius: m.role === "user" ? "18px 18px 4px 18px" : "18px 18px 18px 4px",
                border: "none",
                boxShadow: m.role === "user"
                  ? `0 3px 16px rgba(0,0,0,0.2)`
                  : "0 3px 16px rgba(0,0,0,0.12)",
                maxWidth: "100%",
                fontWeight: 400,
              }}>
                {m.role === "user" ? m.content : <CoachBubble text={m.content} />}
              </div>
            </div>
          ))}
          <div ref={endRef} />
        </>}
      </div>

      {/* ── INPUT BAR ── */}
      {view === "chat" && (
        <div style={{
          padding: "14px 20px 22px",
          borderTop: `1px solid ${C.silverLight}`,
          background: C.headerBg,
          display: "flex", gap: 10, alignItems: "center",
          flexShrink: 0,
          position: "relative", zIndex: 1,
        }}>
          <input
            type="text"
            className="chat-input"
            value={input}
            onChange={e => setInput(e.target.value)}
            onKeyDown={e => { if (e.key === "Enter") { e.preventDefault(); send(); } }}
            placeholder="Type in English..."
            style={{
              flex: 1,
              border: `1.5px solid ${C.silverLight}`,
              borderRadius: 28,
              padding: "13px 22px",
              fontSize: 16,
              background: C.cardBg,
              color: C.dark,
              outline: "none",
              fontFamily: F.sans,
              fontWeight: 400,
              letterSpacing: "0.01em",
              transition: "border-color 0.2s",
            }}
            onFocus={e => e.target.style.borderColor = C.accent}
            onBlur={e => e.target.style.borderColor = C.silverLight}
          />
          <button
            onClick={send}
            disabled={!input.trim()}
            style={{
              width: 48, height: 48, borderRadius: "50%",
              border: "none",
              background: input.trim() ? `linear-gradient(135deg, ${C.accent}, ${C.accentDeep})` : "rgba(255,255,255,0.1)",
              color: C.white,
              fontSize: 17, fontWeight: 600,
              cursor: input.trim() ? "pointer" : "default",
              display: "flex", alignItems: "center", justifyContent: "center",
              flexShrink: 0,
              boxShadow: input.trim() ? `0 3px 14px ${C.accent}50` : "none",
              transition: "all 0.2s",
            }}
          >↑</button>
        </div>
      )}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
